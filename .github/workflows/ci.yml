name: CI

on:
  push:
    branches: [master, improve/readme]
  pull_request:
    branches: [master]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    # Valores fictícios só pra passar em prisma generate/next build sem
    # precisar de segredos reais no CI — nenhuma página faz fetch no banco
    # em build time (todas as rotas dinâmicas são server-rendered on demand),
    # então isso nunca chega a conectar de verdade. npm test não usa NENHUMA
    # dessas vars — os testes rodam contra Postgres real embutido (PGlite),
    # sem precisar de banco externo.
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
      NEXT_PUBLIC_APP_URL: "https://ci-placeholder.example.com"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
